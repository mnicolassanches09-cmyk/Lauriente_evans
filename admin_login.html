{% extends "base.html" %}
{% block title %}Acesso da secretaria — {{ hospital_name }}{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<section class="auth">
  <div class="card auth-card">
    <h1><i class="fa-solid fa-user-shield"></i> Área da secretaria</h1>
    <p class="muted">Acesso restrito a administradores.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>E-mail <input type="email" name="email" value="{{ email }}" required autocomplete="username" autofocus></label>
      <label>Senha <input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </div>
</section>
{% endblock %}
